<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pidis blog</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --border: #2c2c2c;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6; overflow-x: hidden;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; position: relative; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4rem; }
        h1 { font-size: 1.5rem; font-weight: 500; cursor: pointer; }
        
        .view { display: none; opacity: 0; transform: translateY(10px); transition: var(--transition); }
        .view.active { display: block; opacity: 1; transform: translateY(0); }

        .btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: var(--transition); display: inline-flex; align-items: center; }
        .btn:hover { color: var(--accent); }
        .icon-btn { font-size: 1.5rem; width: 40px; height: 40px; justify-content: center; border-radius: 50%; }

        /* Blog List */
        .post-item { list-style: none; margin-bottom: 2rem; cursor: pointer; }
        .post-item .post-title { font-size: 1.2rem; font-weight: 400; transition: var(--transition); }
        .post-item:hover .post-title { color: var(--accent); transform: translateX(4px); }
        .post-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }

        /* Prose / Markdown Styling */
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { margin: 1.5rem 0 1rem 0; font-weight: 500; color: var(--accent); }
        .prose p { margin-bottom: 1.25rem; color: #ccc; }
        .prose a { color: #fff; text-decoration: underline; }
        .prose hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
        .prose blockquote { border-left: 3px solid var(--border); padding-left: 1rem; color: var(--text-muted); margin-bottom: 1rem; }
        .prose pre { background: #000; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; }
        .prose code { background: #000; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        .prose th, .prose td { border: 1px solid var(--border); padding: 0.5rem; }
        .prose th { background: var(--surface); }
        .prose img { max-width: 100%; border-radius: 4px; }
        
        /* Custom Markdown Feature Styles */
        .admonition { border-left: 4px solid var(--accent); background: rgba(255,255,255,0.05); padding: 1rem; margin: 1.5rem 0; border-radius: 0 4px 4px 0; }
        .admonition-danger { border-left-color: #ff4444; }
        .admonition-info { border-left-color: #33b5e5; }
        .admonition-warning { border-left-color: #ffbb33; }
        .admonition-greentext { border-left-color: #00C851; color: #00C851; }
        .spoiler { background-color: #444; color: transparent; border-radius: 3px; padding: 0 4px; cursor: pointer; transition: color 0.3s, background 0.3s; }
        .spoiler.revealed { color: inherit; background-color: rgba(255,255,255,0.1); }
        mark { background: #ffea00; color: #000; padding: 0 2px; }
        .toc { background: var(--surface); padding: 1rem; border-radius: 6px; margin: 1rem 0; font-size: 0.9rem;}
        .toc ul { list-style: none; margin: 0; padding: 0; }

        /* Editor Admin View */
        .editor-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        input[type="text"], textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.8rem; border-radius: 6px; font-family: inherit; font-size: 1rem; outline: none; transition: var(--transition); }
        input[type="text"]:focus, textarea:focus { border-color: var(--text-muted); }

        .editor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: stretch; }
        @media (max-width: 768px) { .editor-split { grid-template-columns: 1fr; } }
        
        textarea { min-height: 400px; resize: vertical; border-radius: 6px; }
        .preview-pane { background: var(--surface); padding: 1.5rem; border-radius: 6px; border: 1px solid var(--border); min-height: 400px; overflow-y: auto; }

        .submit-btn { background: var(--accent); color: var(--bg); padding: 0.8rem; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; transition: var(--transition); margin-top: 1rem;}
        .submit-btn:hover { opacity: 0.9; }
        #editor-status { font-size: 0.9rem; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 onclick="navigateTo('home')">pidis blog</h1>
            <div>
                <button id="home-btn" class="btn" style="display: none;" onclick="navigateTo('home')">← back</button>
                <button id="admin-trigger-btn" class="btn icon-btn" onclick="checkPassword()">+</button>
            </div>
        </header>

        <main>
            <section id="view-home" class="view active">
                <ul id="posts-list"></ul>
            </section>

            <section id="view-post" class="view">
                <article class="prose" id="post-content"></article>
            </section>

            <section id="view-admin" class="view">
                <div class="editor-form">
                    <div class="input-group">
                        <label for="post-title">Blog Title</label>
                        <input type="text" id="post-title" placeholder="Mein schöner Blogpost">
                    </div>
                    <div class="input-group">
                        <label for="post-gh-token">GitHub Personal Access Token (Saved locally)</label>
                        <input type="text" id="post-gh-token" placeholder="glp...">
                    </div>
                    
                    <div class="input-group">
                        <label>Content (Live Preview)</label>
                        <div class="editor-split">
                            <textarea id="post-body" placeholder="Write markdown here..."></textarea>
                            <div class="preview-pane prose" id="post-preview">Preview will appear here...</div>
                        </div>
                    </div>

                    <button class="submit-btn" onclick="publishPost()">Publish Post</button>
                    <p id="editor-status"></p>
                </div>
            </section>
        </main>
    </div>

    <script id="markdown-parser-script">
        // --- CUSTOM EXTENDED MARKDOWN PARSER ---
        // Bundled together so it can be injected into the generated posts
        function parseCustomMarkdown(text) {
            if(!text) return "";
            
            // 1. PRE-PROCESSING
            // Comments [//]: (comment)
            text = text.replace(/^\[\/\/\]: \((.*?)\)$/gm, '');
            // Admonitions !!! type Title \n text
            text = text.replace(/^!!! ([\w]+)(?: (.*))?\n((?:[ ]{4}.*\n?)+)/gm, (m, type, title, body) => {
                let cleanBody = body.replace(/^[ ]{4}/gm, '');
                title = title || type.charAt(0).toUpperCase() + type.slice(1);
                return `<div class="admonition admonition-${type.toLowerCase()}"><strong>${title}</strong><br>${cleanBody}</div>`;
            });
            // Float clear !;
            text = text.replace(/^!;$/gm, '<div style="clear:both;"></div>');
            // Spoilers !>text
            text = text.replace(/!>(.*?)$/gm, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
            // Colors %color% text %%
            text = text.replace(/%([^%]+)%\s+(.*?)\s*%%/g, '<span style="color: $1">$2</span>');
            // Underlines & Types !~color;style;text~!
            text = text.replace(/!~([^~]+)~!/g, (match, content) => {
                let parts = content.trim().split(' ');
                if (parts.length > 1 && parts[0].includes(';')) {
                    let c = parts[0].split(';');
                    let col = c[0] && c[0]!=='default' ? c[0] : 'currentColor';
                    let sty = c[1] && c[1]!=='default' ? c[1] : 'solid';
                    let typ = c[2] && c[2]!=='default' ? c[2] : 'underline';
                    let thk = c[3] && c[3]!=='default' ? c[3]+'px' : 'auto';
                    let str = parts.slice(1).join(' ');
                    return `<span style="text-decoration: ${typ} ${sty} ${col} ${thk};">${str}</span>`;
                }
                return `<span style="text-decoration: underline;">${content}</span>`;
            });
            // Mark ==text==
            text = text.replace(/==([^=]+)==/g, '<mark>$1</mark>');

            // 2. MARKED.JS PARSING
            const renderer = new marked.Renderer();
            let toc = [];
            renderer.heading = function(token) {
                let txt = typeof token === 'string' ? token : token.text;
                let lvl = typeof token === 'string' ? arguments[1] : token.depth;
                const id = txt.toLowerCase().replace(/[^\w]+/g, '-');
                toc.push({ level: lvl, id: id, text: txt });
                return `<h${lvl} id="${id}">${txt}</h${lvl}>\n`;
            };
            marked.use({ renderer, breaks: true, gfm: true });
            let html = marked.parse(text);

            // 3. POST-PROCESSING HTML
            // Alignment
            html = html.replace(/<p>-&gt; (.*?) &lt;-<\/p>/g, '<p style="text-align:center">$1</p>');
            html = html.replace(/<p>-&gt; (.*?) -&gt;<\/p>/g, '<p style="text-align:right">$1</p>');
            html = html.replace(/<h(\d)([^>]*)>-&gt; (.*?) &lt;-<\/h\1>/g, '<h$1$2 style="text-align:center">$3</h$1>');
            // TOC [TOC]
            html = html.replace(/<p>\[TOC(\d)?\]<\/p>/g, (m, minLvl) => {
                let min = minLvl ? parseInt(minLvl) : 1;
                let tocHtml = '<div class="toc"><strong>Table of Contents</strong><ul>';
                toc.filter(h => h.level >= min).forEach(h => {
                    tocHtml += `<li style="margin-left: ${(h.level - min)*1.5}em"><a href="#${h.id}">${h.text}</a></li>`;
                });
                return tocHtml + '</ul></div>';
            });
            // Table newlines \n
            html = html.replace(/(<t[dh][^>]*>)(.*?)(<\/t[dh]>)/gs, (m, o, c, cl) => o + c.replace(/\\n/g, '<br>') + cl);
            // Images Formatting
            html = html.replace(/<img([^>]+)src="([^"]+)"([^>]*)>(?:\s*\{([^:]+):([^}]+)\})/g, '<img$1src="$2"$3 style="width:$4; height:$5;">');
            html = html.replace(/<img([^>]+)src="([^"]+)#(left|right)"([^>]*)>/g, (m, pre, src, dir, post) => {
                let margin = dir === 'left' ? 'margin-right:1rem;' : 'margin-left:1rem;';
                return `<img${pre}src="${src}"${post} style="float:${dir}; ${margin}">`;
            });

            return html;
        }
    </script>

    <script>
        const REPO_OWNER = 'redretep';
        const REPO_NAME = 'info';
        const PASSWORD_HASH = "1204"; 
        let posts = [];

        // App Initialization & Memory load
        document.addEventListener('DOMContentLoaded', () => {
            fetchBlogPosts();
            handleRouting();
            
            // Load saved GitHub token
            const savedToken = localStorage.getItem('pidis_gh_token');
            if(savedToken) document.getElementById('post-gh-token').value = savedToken;
            
            // Editor preview trigger
            document.getElementById('post-body').addEventListener('input', (e) => {
                document.getElementById('post-preview').innerHTML = parseCustomMarkdown(e.target.value);
            });
        });

        // Routing
        function navigateTo(viewId, postIndex = null) {
            const activeView = document.querySelector('.view.active');
            if (activeView) {
                activeView.style.opacity = '0';
                activeView.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    activeView.classList.remove('active');
                    showNewView(viewId, postIndex);
                }, 200);
            } else {
                showNewView(viewId, postIndex);
            }
        }

        function showNewView(viewId, postIndex) {
            const targetView = document.getElementById(`view-${viewId}`);
            const homeBtn = document.getElementById('home-btn');
            const adminBtn = document.getElementById('admin-trigger-btn');

            if (viewId === 'home') {
                homeBtn.style.display = 'none'; adminBtn.style.display = 'flex'; window.location.hash = '';
            } else {
                homeBtn.style.display = 'inline-flex'; adminBtn.style.display = 'none';
            }

            if (viewId === 'post' && postIndex !== null) renderPost(postIndex);
            targetView.classList.add('active'); targetView.offsetHeight; 
            targetView.style.opacity = '1'; targetView.style.transform = 'translateY(0)';
        }

        function handleRouting() {
            if (window.location.hash.startsWith('#post-')) {
                const idx = parseInt(window.location.hash.replace('#post-', ''), 10);
                setTimeout(() => navigateTo('post', idx), 300);
            }
        }

        // Authentication Memory
        function checkPassword() {
            const authSaved = localStorage.getItem('pidis_auth_saved');
            if (authSaved === PASSWORD_HASH) {
                navigateTo('admin');
                return;
            }
            const password = prompt("Enter passcode for pidis blog admin:");
            if (password === PASSWORD_HASH) {
                localStorage.setItem('pidis_auth_saved', password);
                navigateTo('admin');
            } else if (password !== null) {
                alert("Incorrect authorization key.");
            }
        }

        // Directory string sanitizer (handles Umlauts and converts to URL-safe strings)
        function sanitizeTitlePath(title) {
            const charMap = {'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss', 'Ä': 'Ae', 'Ö': 'Oe', 'Ü': 'Ue'};
            return title.replace(/[äöüßÄÖÜ]/g, match => charMap[match])
                        .toLowerCase()
                        .replace(/[^a-z0-9]+/g, '-')
                        .replace(/(^-|-$)/g, '');
        }

        // Fetch structure using GitHub API
        async function fetchBlogPosts() {
            const listContainer = document.getElementById('posts-list');
            listContainer.innerHTML = '<p style="color: var(--text-muted)">Loading thoughts...</p>';
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/blog`);
                if (!response.ok) throw new Error();
                const directories = await response.json();
                posts = [];

                directories.forEach(dir => {
                    if (dir.type === 'dir') {
                        const parts = dir.name.split('-');
                        const dateStr = parts.slice(-3).join('-'); // handles DD-MM-YYYY format
                        if (/^\d{2}\.\d{2}\.\d{4}$/.test(parts[parts.length - 1])) {
                            const dateToStore = parts[parts.length - 1];
                            const titleSlug = parts.slice(0, -1).join('-');
                            // Reconstruct a readable title from slug for list view (rough approximation)
                            const displayTitle = titleSlug.replace(/-/g, ' '); 
                            posts.push({
                                title: displayTitle.charAt(0).toUpperCase() + displayTitle.slice(1),
                                date: dateToStore,
                                path: `blog/${dir.name}/index.html` 
                            });
                        }
                    }
                });

                posts.sort((a, b) => {
                    const pd = d => new Date(d.split('.')[2], d.split('.')[1] - 1, d.split('.')[0]);
                    return pd(b.date) - pd(a.date);
                });
                renderPostList();
            } catch (err) {
                listContainer.innerHTML = '<p style="color: var(--text-muted)">No posts found or repository structure not set up yet.</p>';
            }
        }

        function renderPostList() {
            const listContainer = document.getElementById('posts-list');
            listContainer.innerHTML = '';
            if (posts.length === 0) return listContainer.innerHTML = '<p style="color: var(--text-muted)">No posts found.</p>';

            posts.forEach((post, index) => {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.onclick = () => { window.location.hash = `post-${index}`; navigateTo('post', index); };
                li.innerHTML = `<div class="post-title">${post.title}</div><div class="post-meta">${post.date}</div>`;
                listContainer.appendChild(li);
            });
        }

        async function renderPost(index) {
            const post = posts[index];
            const contentContainer = document.getElementById('post-content');
            contentContainer.innerHTML = '<p style="color: var(--text-muted)">Reading...</p>';

            try {
                const res = await fetch(`/${REPO_NAME}/${post.path}`);
                if (!res.ok) throw new Error();
                const text = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                
                // Get original Title & Date from the parsed template headers if available, or fallback
                const realTitle = doc.title || post.title; 
                const rawMarkdown = doc.getElementById('raw-markdown-source')?.textContent || text;

                contentContainer.innerHTML = `
                    <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: #fff;">${realTitle}</h1>
                    <div style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.9rem;">Published ${post.date}</div>
                    <div class="markdown-body">${parseCustomMarkdown(rawMarkdown)}</div>
                `;
            } catch (e) {
                contentContainer.innerHTML = '<p style="color: var(--text-muted)">Error fetching post content.</p>';
            }
        }

        function generatePostTemplate(title, rawMarkdown) {
            // Include our parser logic as string inside the generated standalone document
            const parserLogicStr = document.getElementById('markdown-parser-script').innerHTML;
            
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
        a { color: #fff; text-decoration: underline; }
        .back-link { display: inline-block; margin-bottom: 2rem; text-decoration: none; color: #a0a0a0; }
        .back-link:hover { color: #fff; }
        .prose h1, .prose h2, .prose h3 { color: #fff; margin: 1.5rem 0 1rem 0; font-weight: 500;}
        .prose p { margin-bottom: 1.25rem; color: #ccc; }
        .prose blockquote { border-left: 3px solid #2c2c2c; padding-left: 1rem; color: #a0a0a0; }
        .prose pre { background: #000; padding: 1rem; border-radius: 6px; overflow-x: auto; margin-bottom: 1rem; }
        .prose code { background: #000; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        .prose th, .prose td { border: 1px solid #2c2c2c; padding: 0.5rem; }
        .admonition { border-left: 4px solid #fff; background: rgba(255,255,255,0.05); padding: 1rem; margin: 1.5rem 0; border-radius: 0 4px 4px 0; }
        .admonition-danger { border-left-color: #ff4444; } .admonition-info { border-left-color: #33b5e5; } .admonition-warning { border-left-color: #ffbb33; } .admonition-greentext { border-left-color: #00C851; color: #00C851; }
        .spoiler { background-color: #444; color: transparent; border-radius: 3px; padding: 0 4px; cursor: pointer; transition: 0.3s; }
        .spoiler.revealed { color: inherit; background-color: rgba(255,255,255,0.1); }
        mark { background: #ffea00; color: #000; padding: 0 2px; }
        .toc { background: #1e1e1e; padding: 1rem; border-radius: 6px; margin: 1rem 0; font-size: 0.9rem;}
        .toc ul { list-style: none; margin: 0; padding: 0; }
        img { max-width: 100%; border-radius: 4px; }
    </style>
    <script>
        ${parserLogicStr}
        document.addEventListener('DOMContentLoaded', () => {
            const md = document.getElementById('raw-markdown-source').textContent;
            document.getElementById('view').innerHTML = parseCustomMarkdown(md);
        });
    <\/script>
</head>
<body>
    <a href="/${REPO_NAME}/" class="back-link">← Back to Dashboard</a>
    <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">${title}</h1>
    <main id="view" class="prose">Loading...</main>
    <script type="text/plain" id="raw-markdown-source">${rawMarkdown}<\/script>
</body>
</html>`;
        }

        async function publishPost() {
            const title = document.getElementById('post-title').value.trim();
            const token = document.getElementById('post-gh-token').value.trim();
            const body = document.getElementById('post-body').value;
            const statusEl = document.getElementById('editor-status');

            if (!title || !token || !body) {
                statusEl.textContent = "Error: All fields must be populated.";
                return;
            }

            // Save Token to Memory
            localStorage.setItem('pidis_gh_token', token);

            statusEl.textContent = "Committing to main branch...";
            
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const formattedDate = `${day}.${month}.${now.getFullYear()}`;

            const cleanSlug = sanitizeTitlePath(title);
            const directoryName = `${cleanSlug}-${formattedDate}`;
            const targetFilePath = `blog/${directoryName}/index.html`;

            const indexPayloadHTML = generatePostTemplate(title, body);
            
            // Note: btoa() fails on utf-8 characters like äöü inside the markdown body itself. 
            // We must properly encode Unicode strings to base64.
            const encodeBase64Unicode = str => btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
            const contentBase64 = encodeBase64Unicode(indexPayloadHTML);

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetFilePath}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `feat: Add blog post ${title}`, content: contentBase64, branch: 'main' })
                });

                if (response.ok) {
                    statusEl.textContent = "Successfully Published! Reloading...";
                    setTimeout(() => {
                        document.getElementById('post-title').value = '';
                        document.getElementById('post-body').value = '';
                        document.getElementById('post-preview').innerHTML = 'Preview will appear here...';
                        fetchBlogPosts();
                        navigateTo('home');
                    }, 1500);
                } else {
                    const errData = await response.json();
                    statusEl.textContent = `GitHub Error: ${errData.message}`;
                }
            } catch (err) {
                statusEl.textContent = "Network error connecting to GitHub API.";
            }
        }
    </script>
</body>
</html>
