<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Blog</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent: #ffffff;
            --border: #2c2c2c;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Layout & Container */
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            cursor: pointer;
        }

        /* Views (Pages) & Transitions */
        .view {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
        }

        .view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Buttons & Interactive Elements */
        .btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .btn:hover {
            color: var(--accent);
        }

        .icon-btn {
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        /* Blog List Home View */
        .post-item {
            list-style: none;
            margin-bottom: 2rem;
            cursor: pointer;
            group: true;
        }

        .post-item .post-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text);
            transition: var(--transition);
        }

        .post-item:hover .post-title {
            color: var(--accent);
            transform: translateX(4px);
        }

        .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* Post Content View */
        .prose {
            font-size: 1.05rem;
        }

        .prose h1, .prose h2, .prose h3 {
            margin: 1.5rem 0 1rem 0;
            font-weight: 500;
            color: var(--accent);
        }

        .prose p {
            margin-bottom: 1.25rem;
            color: #ccc;
        }

        /* Editor Admin View */
        .editor-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"], textarea {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--text-muted);
        }

        /* WYSIWYG/Markdown Editor Controls */
        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            background: var(--surface);
            padding: 0.5rem;
            border-radius: 6px 6px 0 0;
            border: 1px solid var(--border);
            border-bottom: none;
        }

        .editor-toolbar .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.9rem;
            background: #2a2a2a;
            border-radius: 4px;
            color: var(--text);
        }

        .editor-toolbar .btn:hover {
            background: #3a3a3a;
        }

        textarea {
            border-radius: 0 0 6px 6px;
            min-height: 300px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--accent);
            color: var(--bg);
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        #editor-status {
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 onclick="navigateTo('home')">info</h1>
            <div>
                <button id="home-btn" class="btn" style="display: none;" onclick="navigateTo('home')">← back</button>
                <button id="admin-trigger-btn" class="btn icon-btn" onclick="checkPassword()">+</button>
            </div>
        </header>

        <main>
            <section id="view-home" class="view active">
                <ul id="posts-list">
                    </ul>
            </section>

            <section id="view-post" class="view">
                <article class="prose" id="post-content">
                    </article>
            </section>

            <section id="view-admin" class="view">
                <div class="editor-form">
                    <div class="input-group">
                        <label for="post-title">Blog Title</label>
                        <input type="text" id="post-title" placeholder="My New Masterpiece">
                    </div>

                    <div class="input-group">
                        <label for="post-gh-token">GitHub Personal Access Token (glp...)</label>
                        <input type="text" id="post-gh-token" placeholder="Paste your token here">
                    </div>

                    <div class="input-group">
                        <label>Content</label>
                        <div class="editor-toolbar">
                            <button class="btn" onclick="wrapText('**', '**')">B</button>
                            <button class="btn" onclick="wrapText('*', '*')">I</button>
                            <button class="btn" onclick="wrapText('# ', '')">H1</button>
                            <button class="btn" onclick="wrapText('## ', '')">H2</button>
                            <button class="btn" onclick="wrapText('[', '](url)')">Link</button>
                        </div>
                        <textarea id="post-body" placeholder="Start typing your story... (Supports Markdown)"></textarea>
                    </div>

                    <button class="submit-btn" onclick="publishPost()">Publish Post</button>
                    <p id="editor-status"></p>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Configuration
        const REPO_OWNER = 'redretep';
        const REPO_NAME = 'info';
        const PASSWORD_HASH = "1204"; // Raw text as requested to stay in source code

        // State containing hardcoded references or fetched paths 
        // GitHub API cannot always cleanly list directories without authentication on Pages, 
        // so we track them locally or fall back to checking the repo structure.
        let posts = [];

        // App Initialization
        document.addEventListener('DOMContentLoaded', () => {
            fetchBlogPosts();
            handleRouting();
        });

        // Simple router/view switcher with animations
        function navigateTo(viewId, postIndex = null) {
            const activeView = document.querySelector('.view.active');
            if (activeView) {
                activeView.style.opacity = '0';
                activeView.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    activeView.classList.remove('active');
                    showNewView(viewId, postIndex);
                }, 200);
            } else {
                showNewView(viewId, postIndex);
            }
        }

        function showNewView(viewId, postIndex) {
            const targetView = document.getElementById(`view-${viewId}`);
            const homeBtn = document.getElementById('home-btn');
            const adminBtn = document.getElementById('admin-trigger-btn');

            if (viewId === 'home') {
                homeBtn.style.display = 'none';
                adminBtn.style.display = 'flex';
                window.location.hash = '';
            } else {
                homeBtn.style.display = 'inline-flex';
                adminBtn.style.display = 'none';
            }

            if (viewId === 'post' && postIndex !== null) {
                renderPost(postIndex);
            }

            targetView.classList.add('active');
            // Force reflow
            targetView.offsetHeight; 
            targetView.style.opacity = '1';
            targetView.style.transform = 'translateY(0)';
        }

        function handleRouting() {
            if (window.location.hash.startsWith('#post-')) {
                const idx = parseInt(window.location.hash.replace('#post-', ''), 10);
                setTimeout(() => navigateTo('post', idx), 300);
            }
        }

        // Fetch structure using GitHub Public API to discover /blog/ contents
        async function fetchBlogPosts() {
            const listContainer = document.getElementById('posts-list');
            listContainer.innerHTML = '<p style="color: var(--text-muted)">Loading thoughts...</p>';

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/blog`);
                if (!response.ok) throw new Error('Could not find blog folder structure');
                
                const directories = await response.json();
                posts = [];

                // Filter for folders matching format: nameoftheblog-DD.MM.YYYY
                directories.forEach(dir => {
                    if (dir.type === 'dir') {
                        const parts = dir.name.split('-');
                        const dateStr = parts[parts.length - 1];
                        
                        // Simple regex check for DD.MM.YYYY format
                        if (/^\d{2}\.\d{2}\.\d{4}$/.test(dateStr)) {
                            const title = parts.slice(0, -1).join(' ').replace(/_/g, ' ');
                            posts.push({
                                title: title.charAt(0).toUpperCase() + title.slice(1),
                                date: dateStr,
                                rawDirName: dir.name,
                                path: `blog/${dir.name}/index.html` 
                            });
                        }
                    }
                });

                // Sort posts by date descending
                posts.sort((a, b) => {
                    const parseDate = (dStr) => {
                        const [d, m, y] = dStr.split('.').map(Number);
                        return new Date(y, m - 1, d);
                    };
                    return parseDate(b.date) - parseDate(a.date);
                });

                renderPostList();
            } catch (err) {
                listContainer.innerHTML = '<p style="color: var(--text-muted)">No posts published yet. Use the "+" menu to create your first blog entry.</p>';
            }
        }

        function renderPostList() {
            const listContainer = document.getElementById('posts-list');
            listContainer.innerHTML = '';

            if (posts.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-muted)">No posts found.</p>';
                return;
            }

            posts.forEach((post, index) => {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.onclick = () => {
                    window.location.hash = `post-${index}`;
                    navigateTo('post', index);
                };

                li.innerHTML = `
                    <div class="post-title">${post.title}</div>
                    <div class="post-meta">${post.date}</div>
                `;
                listContainer.appendChild(li);
            });
        }

        // Fetch actual markdown inside the specified index.html deployment file
        async function renderPost(index) {
            const post = posts[index];
            const contentContainer = document.getElementById('post-content');
            contentContainer.innerHTML = '<p style="color: var(--text-muted)">Reading...</p>';

            try {
                // Fetch index.html directly from your deployment path
                const res = await fetch(`/${REPO_NAME}/${post.path}`);
                if (!res.ok) throw new Error();
                const text = await res.text();

                // Extract Markdown hidden within the template or full payload text
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const rawMarkdown = doc.getElementById('raw-markdown-source')?.textContent || text;

                contentContainer.innerHTML = `
                    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">${post.title}</h1>
                    <div style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.9rem;">Published ${post.date}</div>
                    <div class="markdown-body">${marked.parse(rawMarkdown)}</div>
                `;
            } catch (e) {
                contentContainer.innerHTML = '<p style="color: var(--text-muted)">Error fetching or parsing post content.</p>';
            }
        }

        // Authentication Gate
        function checkPassword() {
            const password = prompt("Enter passcode to access text editor:");
            if (password === PASSWORD_HASH) {
                navigateTo('admin');
            } else if (password !== null) {
                alert("Incorrect authorization key.");
            }
        }

        // UI Text Helper for Textarea Editor (Google Docs Feel)
        function wrapText(before, after) {
            const textarea = document.getElementById('post-body');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selectedStr = text.substring(start, end);
            
            const replacement = before + selectedStr + after;
            textarea.value = text.substring(0, start) + replacement + text.substring(end);
            
            textarea.focus();
            textarea.setSelectionRange(start + before.length, start + before.length + selectedStr.length);
        }

        // Generate dynamic standalone single-file packages for your individual post routes
        function generatePostTemplate(title, rawMarkdown) {
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const md = document.getElementById('raw-markdown-source').textContent;
            document.getElementById('view').innerHTML = marked.parse(md);
        });
    <\/script>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem; }
        a { color: #fff; text-decoration: none; display: inline-block; margin-bottom: 2rem; }
        .prose h1, .prose h2 { color: #fff; margin: 1.5rem 0 1rem 0; }
        .prose p { margin-bottom: 1.25rem; color: #ccc; line-height: 1.6; }
    </style>
</head>
<body>
    <a href="/${REPO_NAME}/">← Back to Dashboard</a>
    <main id="view" class="prose"></main>
    <script type="text/plain" id="raw-markdown-source">${rawMarkdown}<\/script>
</body>
</html>`;
        }

        // Commit content directly into git via standard HTTP request
        async function publishPost() {
            const title = document.getElementById('post-title').value.trim();
            const token = document.getElementById('post-gh-token').value.trim();
            const body = document.getElementById('post-body').value;
            const statusEl = document.getElementById('editor-status');

            if (!title || !token || !body) {
                statusEl.textContent = "Error: All fields must be populated.";
                return;
            }

            statusEl.textContent = "Committing files securely onto main branch...";

            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const formattedDate = `${day}.${month}.${year}`;

            const cleanTitle = title.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const directoryName = `${cleanTitle}-${formattedDate}`;
            const targetFilePath = `blog/${directoryName}/index.html`;

            const indexPayloadHTML = generatePostTemplate(title, body);
            const contentBase64 = btoa(unescape(encodeURIComponent(indexPayloadHTML)));

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetFilePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `feat: Add blog post ${title}`,
                        content: contentBase64,
                        branch: 'main'
                    })
                });

                if (response.ok) {
                    statusEl.textContent = "Successfully Published! Reloading setup...";
                    setTimeout(() => {
                        document.getElementById('post-title').value = '';
                        document.getElementById('post-body').value = '';
                        fetchBlogPosts();
                        navigateTo('home');
                    }, 1500);
                } else {
                    const errData = await response.json();
                    statusEl.textContent = `GitHub API Error: ${errData.message}`;
                }
            } catch (err) {
                statusEl.textContent = "Failed to establish cross-origin stream connection to GitHub.";
            }
        }
    </script>
</body>
</html>
