    <script>
        
        // --- CUSTOM EXTENDED MARKDOWN PARSER ---
        // Bundled together so it can be injected into the generated posts
        function parseCustomMarkdown(text) {
            if(!text) return "";
            
            // 1. PRE-PROCESSING
            // Comments [//]: (comment)
            text = text.replace(/^\[\/\/\]: \((.*?)\)$/gm, '');
            // Admonitions !!! type Title \n text
            text = text.replace(/^!!! ([\w]+)(?: (.*))?\n((?:[ ]{4}.*\n?)+)/gm, (m, type, title, body) => {
                let cleanBody = body.replace(/^[ ]{4}/gm, '');
                title = title || type.charAt(0).toUpperCase() + type.slice(1);
                return `<div class="admonition admonition-${type.toLowerCase()}"><strong>${title}</strong><br>${cleanBody}</div>`;
            });
            // Float clear !;
            text = text.replace(/^!;$/gm, '<div style="clear:both;"></div>');
            // Spoilers !>text
            text = text.replace(/!>(.*?)$/gm, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
            // Colors %color% text %%
            text = text.replace(/%([^%]+)%\s+(.*?)\s*%%/g, '<span style="color: $1">$2</span>');
            // Underlines & Types !~color;style;text~!
            text = text.replace(/!~([^~]+)~!/g, (match, content) => {
                let parts = content.trim().split(' ');
                if (parts.length > 1 && parts[0].includes(';')) {
                    let c = parts[0].split(';');
                    let col = c[0] && c[0]!=='default' ? c[0] : 'currentColor';
                    let sty = c[1] && c[1]!=='default' ? c[1] : 'solid';
                    let typ = c[2] && c[2]!=='default' ? c[2] : 'underline';
                    let thk = c[3] && c[3]!=='default' ? c[3]+'px' : 'auto';
                    let str = parts.slice(1).join(' ');
                    return `<span style="text-decoration: ${typ} ${sty} ${col} ${thk};">${str}</span>`;
                }
                return `<span style="text-decoration: underline;">${content}</span>`;
            });
            // Mark ==text==
            text = text.replace(/==([^=]+)==/g, '<mark>$1</mark>');

            // 2. MARKED.JS PARSING
            const renderer = new marked.Renderer();
            let toc = [];
            renderer.heading = function(token) {
                let txt = typeof token === 'string' ? token : token.text;
                let lvl = typeof token === 'string' ? arguments[1] : token.depth;
                const id = txt.toLowerCase().replace(/[^\w]+/g, '-');
                toc.push({ level: lvl, id: id, text: txt });
                return `<h${lvl} id="${id}">${txt}</h${lvl}>\n`;
            };
            marked.use({ renderer, breaks: true, gfm: true });
            let html = marked.parse(text);

            // 3. POST-PROCESSING HTML
            // Alignment
            html = html.replace(/<p>-&gt; (.*?) &lt;-<\/p>/g, '<p style="text-align:center">$1</p>');
            html = html.replace(/<p>-&gt; (.*?) -&gt;<\/p>/g, '<p style="text-align:right">$1</p>');
            html = html.replace(/<h(\d)([^>]*)>-&gt; (.*?) &lt;-<\/h\1>/g, '<h$1$2 style="text-align:center">$3</h$1>');
            // TOC [TOC]
            html = html.replace(/<p>\[TOC(\d)?\]<\/p>/g, (m, minLvl) => {
                let min = minLvl ? parseInt(minLvl) : 1;
                let tocHtml = '<div class="toc"><strong>Table of Contents</strong><ul>';
                toc.filter(h => h.level >= min).forEach(h => {
                    tocHtml += `<li style="margin-left: ${(h.level - min)*1.5}em"><a href="#${h.id}">${h.text}</a></li>`;
                });
                return tocHtml + '</ul></div>';
            });
            // Table newlines \n
            html = html.replace(/(<t[dh][^>]*>)(.*?)(<\/t[dh]>)/gs, (m, o, c, cl) => o + c.replace(/\\n/g, '<br>') + cl);
            // Images Formatting
            html = html.replace(/<img([^>]+)src="([^"]+)"([^>]*)>(?:\s*\{([^:]+):([^}]+)\})/g, '<img$1src="$2"$3 style="width:$4; height:$5;">');
            html = html.replace(/<img([^>]+)src="([^"]+)#(left|right)"([^>]*)>/g, (m, pre, src, dir, post) => {
                let margin = dir === 'left' ? 'margin-right:1rem;' : 'margin-left:1rem;';
                return `<img${pre}src="${src}"${post} style="float:${dir}; ${margin}">`;
            });

            return html;
        }
    
        document.addEventListener('DOMContentLoaded', () => {
            const md = document.getElementById('raw-markdown-source').textContent;
            document.getElementById('view').innerHTML = parseCustomMarkdown(md);
        });
